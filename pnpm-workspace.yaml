packages:
  - apps/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    # jsx-a11y 6.10.2 declares eslint <=9 but only uses context APIs that ESLint 10 keeps.
    eslint-plugin-jsx-a11y>eslint: '10'

# None of these build scripts is needed: the Prisma CLI downloads its schema engine on first use;
# esbuild (used by tsx), @swc/core and @parcel/watcher (used by Jest) load their prebuilt platform
# packages, and their scripts only check for them or build from source when they are missing.
# The msw script only copies the browser worker for `msw.workerDirectory`; the tests use msw/node.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - msw
  - prisma
